description: Nikola Znaor Architects. Arhitektura oblikovana prirodnom inteligencijom, u Nizozemskoj i Hrvatskoj. Dostupni za privatne kuće i obnove.

tagline:
  - Arhitektura oblikovana prirodnom inteligencijom,
  - u Nizozemskoj i Hrvatskoj.

approach:
  statement:
    - Struktura koja raste iz svog mjesta.
    - Minimalno, funkcionalno i istančano.
  text: "Svaki projekt počinje od svog mjesta: tla na kojem stoji, putanje sunca, vjetra i klime, materijala nadohvat ruke i umijeća ljudi koji ondje grade. Zgrada izrasta iz tih uvjeta, kao što biljka izrasta iz svog tla."
  principles:
    - title: Istina materijala
      sketch: material   # little animated drawing: material | structure | climate
      text: Kamen, drvo i vapno korišteni onakvi kakvi jesu, uz vidljivo umijeće ljudi koji s njima grade.
    - title: Konstrukcija kao izraz
      sketch: structure   # little animated drawing: material | structure | climate
      text: Tok sila postaje oblik. Rebra, ljuske i razgranati oslonci nose zgradu i daju joj karakter.
    - title: Klima na prvom mjestu
      sketch: climate   # little animated drawing: material | structure | climate
      text: Orijentacija, zasjenjenje i prozračivanje dolaze prije svega, tako da posao obavlja zgrada, a ne strojevi.

studio:
  statement: Od prve skice do dozvole i gradnje.
  text: Nikola Znaor nagrađivani je arhitekt i izumitelj koji radi između Nizozemske i Hrvatske.
