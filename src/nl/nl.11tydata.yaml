description: Nikola Znaor Architects. Architectuur gevormd door natuurlijke intelligentie. Open voor opdrachten, van particuliere woningen en renovaties tot paviljoens en openbare gebouwen.

tagline:
  - Architectuur gevormd door natuurlijke intelligentie.

approach:
  statement:
    - Structuur die uit haar plek groeit.
    - Minimaal, functioneel en verfijnd.
  text: "Elk project begint bij de plek: de grond waarop het staat, de baan van de zon, de wind en het klimaat, de materialen die voorhanden zijn en het vakmanschap van de mensen die er bouwen. Het gebouw groeit vanuit deze omstandigheden, zoals een plant uit de bodem."
  principles:
    - title: Klimaat voorop
      sketch: climate   # little animated drawing: material | structure | climate
      text: Oriëntatie, zonwering en ventilatie komen op de eerste plaats, zodat het gebouw zelf het werk doet, niet de installaties.
    - title: Trouw aan het materiaal
      sketch: material   # little animated drawing: material | structure | climate
      text: Steen, hout en kalk, ingezet om wat ze zijn; het vakmanschap van de mensen die ermee bouwen blijft zichtbaar.
    - title: Constructie als expressie
      sketch: structure   # little animated drawing: material | structure | climate
      text: De krachtsafdracht wordt vorm. Ribben, schalen en vertakte steunen dragen het gebouw en geven het zijn karakter.

studio:
  statement: Van eerste schets via vergunning tot uitvoering.
  text: Nikola Znaor is een bekroonde architect en uitvinder, werkzaam in Nederland en Kroatië.
