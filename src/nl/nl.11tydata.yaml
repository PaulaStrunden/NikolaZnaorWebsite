description: Nikola Znaor Architects. Architectuur gevormd door natuurlijke intelligentie, in Nederland en Kroatië. Beschikbaar voor particuliere woningen en renovaties.

tagline:
  - Architectuur gevormd door natuurlijke intelligentie,
  - in Nederland en Kroatië.

approach:
  statement:
    - Structuur die groeit uit haar plek.
    - Minimaal, functioneel en verfijnd.
  text: "Elk project begint bij zijn plek: de grond waarop het staat, de baan van de zon, de wind en het klimaat, de materialen die voorhanden zijn en het vakmanschap van de mensen die er bouwen. Het gebouw groeit uit deze omstandigheden, zoals een plant uit zijn bodem groeit."
  principles:
    - title: Trouw aan het materiaal
      sketch: material   # little animated drawing: material | structure | climate
      text: Steen, hout en kalk gebruikt om wat ze zijn, met het vakmanschap van de mensen die ermee bouwen zichtbaar gemaakt.
    - title: Constructie als expressie
      sketch: structure   # little animated drawing: material | structure | climate
      text: De krachtenloop wordt de vorm. Ribben, schalen en vertakte steunen dragen het gebouw en geven het zijn karakter.
    - title: Klimaat voorop
      sketch: climate   # little animated drawing: material | structure | climate
      text: Oriëntatie, zonwering en ventilatie gaan voor alles, zodat het gebouw het werk doet in plaats van machines.

studio:
